<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<title>{% block title %}Petra Panel{% endblock %}</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:          #eaf1f8;
    --panel:       #ffffff;
    --border:      #e4e9f0;
    --text:        #1a1d29;
    --text-sub:    #656d76;
    --muted:       #9099a8;
    --accent:      #7c5cff;
    --orange:      #f97316;
    --green:       #16a34a;
    --green-soft:  #86efac;
    --green-fade:  #dcfce7;
    --red:         #dc2626;
  }
  :root[data-theme="dark"] {
    --bg:          #0e1117;
    --panel:       #161b22;
    --border:      #2a3140;
    --text:        #e6edf3;
    --text-sub:    #9099a8;
    --muted:       #656d76;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }

  /* ---- TOP NAV ---------------------------------------------------- */
  .topbar {
    display: flex; align-items: center; gap: 14px;
    padding: 18px 28px;
    background: var(--bg);
    border-bottom: 1px solid transparent;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    font-size: 19px; font-weight: 800;
    letter-spacing: -0.3px;
  }
  .brand .logo {
    width: 36px; height: 36px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), #6a4ae8);
    display: inline-flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 800; font-size: 16px;
  }
  .nav-pill {
    margin: 0 auto;
    display: inline-flex; align-items: center; gap: 4px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px;
    box-shadow: 0 1px 3px rgba(0,0,0,.03);
  }
  .nav-pill a {
    padding: 8px 18px; border-radius: 999px;
    font-size: 13.5px; font-weight: 500;
    color: var(--text-sub);
    transition: all 150ms ease;
  }
  .nav-pill a:hover { color: var(--text); }
  .nav-pill a.active {
    background: #d9f99d;
    color: #1a2e05;
    font-weight: 600;
  }
  :root[data-theme="dark"] .nav-pill a.active {
    background: #365314; color: #d9f99d;
  }
  .topbar-right {
    display: flex; align-items: center; gap: 10px;
  }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--panel); border: 1px solid var(--border);
    cursor: pointer; font-size: 16px; color: var(--text-sub);
    display: inline-flex; align-items: center; justify-content: center;
    position: relative;
  }
  .icon-btn:hover { color: var(--text); }
  .icon-btn .dot {
    position: absolute; top: 9px; right: 11px;
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--orange); border: 2px solid var(--panel);
  }
  .user-chip {
    display: inline-flex; align-items: center; gap: 10px;
    background: var(--panel); border: 1px solid var(--border);
    padding: 4px 12px 4px 4px; border-radius: 999px;
  }
  .user-chip .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: linear-gradient(135deg, #7c5cff, #6a4ae8);
    color: #fff; display: inline-flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 12.5px;
  }
  .user-chip .who {
    display: flex; flex-direction: column; line-height: 1.2;
  }
  .user-chip .who .name { font-size: 12.5px; font-weight: 600; }
  .user-chip .who .role { font-size: 10.5px; color: var(--text-sub); }

  main.content { padding: 8px 28px 32px; }

  @media (max-width: 1024px) {
    .nav-pill { display: none; }
    .topbar { padding: 14px 16px; }
    main.content { padding: 8px 16px 24px; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">P</span>
    <span>Petra</span>
  </div>
  <nav class="nav-pill">
    <a class="{% if block == 'dashboard' %}active{% endif %}"
       href="/panel/petra/v2?token={{ token }}">Dashboard</a>
    <a href="/panel/petra?token={{ token }}">Contenido</a>
    <a href="/panel/petra/agentes?token={{ token }}">Base</a>
    <a href="/panel/petra/embudo?token={{ token }}">Ventas</a>
    <a href="/panel/petra/visitas?token={{ token }}">Operaciones</a>
    <a href="/panel/petra/observabilidad?token={{ token }}">Salud</a>
  </nav>
  <div class="topbar-right">
    <button class="icon-btn" onclick="(function(r){var c=r.getAttribute('data-theme'),n=c==='dark'?'light':'dark';r.setAttribute('data-theme',n);try{localStorage.setItem('petra_theme_v2',n)}catch(e){}})(document.documentElement)">🌓</button>
    <button class="icon-btn" title="Notificaciones">🔔<span class="dot"></span></button>
    <div class="user-chip">
      <div class="avatar">F</div>
      <div class="who"><span class="name">Fabricio</span><span class="role">Admin</span></div>
    </div>
  </div>
</header>

<main class="content">
  {% block content %}{% endblock %}
</main>

<script>
try {
  var saved = localStorage.getItem('petra_theme_v2');
  if (saved) document.documentElement.setAttribute('data-theme', saved);
} catch(e){}
</script>

</body>
</html>

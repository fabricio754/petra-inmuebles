name: Monitor Actor Apify

on:
  schedule:
    # 1pm UTC = 8am Colombia (2h después del actor que corre a las 11am UTC)
    - cron: "0 13 * * 1-6"
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run ID específico a verificar (opcional)"
        required: false

jobs:
  check-actor-status:
    name: Verificar último run del actor
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Obtener último run del actor
        id: get_run
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ACTOR_TASK_ID: MjJ6kqVOBFbrM9Z7s
        run: |
          echo "Consultando último run de la task $ACTOR_TASK_ID..."
          RESPONSE=$(curl -s \
            "https://api.apify.com/v2/actor-tasks/${ACTOR_TASK_ID}/runs?limit=1&desc=true" \
            -H "Authorization: Bearer $APIFY_TOKEN")
          echo "Response: $RESPONSE"

          RUN_ID=$(echo "$RESPONSE" | python3 -c "import json,sys; d=json.load(sys.stdin); items=d['data']['items']; print(items[0]['id'] if items else '')" 2>/dev/null)
          STATUS=$(echo "$RESPONSE" | python3 -c "import json,sys; d=json.load(sys.stdin); items=d['data']['items']; print(items[0]['status'] if items else 'NO_RUNS')" 2>/dev/null)
          STARTED=$(echo "$RESPONSE" | python3 -c "import json,sys; d=json.load(sys.stdin); items=d['data']['items']; print(items[0].get('startedAt','') if items else '')" 2>/dev/null)

          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "started_at=$STARTED" >> $GITHUB_OUTPUT
          echo "Status del último run: $STATUS (ID: $RUN_ID)"

      - name: Esperar si el actor sigue corriendo (retry hasta 3 veces)
        id: wait_running
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          STATUS="${{ steps.get_run.outputs.status }}"
          RUN_ID="${{ steps.get_run.outputs.run_id }}"
          FINAL_STATUS="$STATUS"

          if [ "$STATUS" = "RUNNING" ] || [ "$STATUS" = "READY" ]; then
            echo "Actor en estado $STATUS, esperando hasta 30 minutos..."
            for i in 1 2 3; do
              echo "Intento $i/3 - esperando 10 minutos..."
              sleep 600
              RUN_RESP=$(curl -s \
                "https://api.apify.com/v2/actor-runs/${RUN_ID}" \
                -H "Authorization: Bearer $APIFY_TOKEN")
              FINAL_STATUS=$(echo "$RUN_RESP" | python3 -c "import json,sys; print(json.load(sys.stdin)['data']['status'])" 2>/dev/null)
              echo "Estado actual: $FINAL_STATUS"
              if [ "$FINAL_STATUS" != "RUNNING" ] && [ "$FINAL_STATUS" != "READY" ]; then
                echo "Run terminó con estado: $FINAL_STATUS"
                break
              fi
            done
          fi

          echo "final_status=$FINAL_STATUS" >> $GITHUB_OUTPUT
          echo "Estado final: $FINAL_STATUS"

      - name: Obtener log del run si falló
        id: get_log
        if: |
          steps.wait_running.outputs.final_status == 'FAILED' ||
          steps.wait_running.outputs.final_status == 'TIMED-OUT' ||
          steps.wait_running.outputs.final_status == 'ABORTED'
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          RUN_ID="${{ steps.get_run.outputs.run_id }}"
          echo "Obteniendo log del run $RUN_ID..."
          LOG=$(curl -s \
            "https://api.apify.com/v2/actor-runs/${RUN_ID}/log" \
            -H "Authorization: Bearer $APIFY_TOKEN" | head -c 4000)
          echo "log<<EOF" >> $GITHUB_OUTPUT
          echo "$LOG" | head -50 >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Crear GitHub Issue si el actor falló
        if: |
          steps.wait_running.outputs.final_status == 'FAILED' ||
          steps.wait_running.outputs.final_status == 'TIMED-OUT' ||
          steps.wait_running.outputs.final_status == 'ABORTED'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FINAL_STATUS: ${{ steps.wait_running.outputs.final_status }}
          RUN_ID: ${{ steps.get_run.outputs.run_id }}
          STARTED_AT: ${{ steps.get_run.outputs.started_at }}
          LOG_SNIPPET: ${{ steps.get_log.outputs.log }}
        run: |
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          ISSUE_BODY="## Actor Apify falló

          **Fecha:** ${DATE}
          **Status:** ${FINAL_STATUS}
          **Run ID:** ${RUN_ID}
          **Iniciado:** ${STARTED_AT}
          **Task:** petra-scraper-produccion (MjJ6kqVOBFbrM9Z7s)
          **Actor:** petra-secondaries/my-actor (c5Dx4kjZENfbeKYi1)

          ### Log (primeras 50 líneas):
          \`\`\`
          ${LOG_SNIPPET}
          \`\`\`

          ### Links útiles:
          - [Ver run en Apify](https://console.apify.com/actors/c5Dx4kjZENfbeKYi1/runs/${RUN_ID})
          - [Ver task](https://console.apify.com/actors/c5Dx4kjZENfbeKYi1/tasks/MjJ6kqVOBFbrM9Z7s)
          "

          gh issue create \
            --repo "${{ github.repository }}" \
            --title "🚨 Actor Apify falló - ${DATE} [${FINAL_STATUS}]" \
            --body "$ISSUE_BODY" \
            --label "bug" 2>/dev/null || \
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Actor Apify fallo - ${DATE} [${FINAL_STATUS}]" \
            --body "$ISSUE_BODY"

          echo "::error::Actor Apify terminó con estado ${FINAL_STATUS}. Run ID: ${RUN_ID}"
          exit 1

      - name: Obtener estadísticas del run exitoso
        if: steps.wait_running.outputs.final_status == 'SUCCEEDED'
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          RUN_ID="${{ steps.get_run.outputs.run_id }}"
          STARTED="${{ steps.get_run.outputs.started_at }}"
          RUN_RESP=$(curl -s \
            "https://api.apify.com/v2/actor-runs/${RUN_ID}" \
            -H "Authorization: Bearer $APIFY_TOKEN")

          DURATION=$(echo "$RUN_RESP" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['data']
          stats=d.get('stats',{})
          secs=stats.get('durationMillis',0)//1000
          print(f'{secs}s')
          " 2>/dev/null || echo "N/A")

          DATASET_ID=$(echo "$RUN_RESP" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['data']
          print(d.get('defaultDatasetId',''))
          " 2>/dev/null)

          ITEMS=0
          if [ -n "$DATASET_ID" ]; then
            ITEMS=$(curl -s \
              "https://api.apify.com/v2/datasets/${DATASET_ID}" \
              -H "Authorization: Bearer $APIFY_TOKEN" | \
              python3 -c "import json,sys; print(json.load(sys.stdin)['data'].get('itemCount',0))" 2>/dev/null || echo "0")
          fi

          echo "✅ OK: Actor SUCCEEDED en ${DURATION} - ${ITEMS} contactos guardados (Run: ${RUN_ID})"

      - name: Sin runs encontrados
        if: steps.get_run.outputs.status == 'NO_RUNS'
        run: |
          echo "::warning::No se encontraron runs para la task MjJ6kqVOBFbrM9Z7s"

name: Build Actor Apify + Re-setup Task
on:
  push:
    branches:
      - trigger/build-actor

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Subir source al actor y disparar build
        id: build
        run: |
          # Construir JSON con jq (evita límites de tamaño de args del shell)
          jq -n \
            --arg aj  "$(base64 -w0 actor/.actor/actor.json)" \
            --arg sch "$(base64 -w0 actor/.actor/input_schema.json)" \
            --arg df  "$(base64 -w0 actor/Dockerfile)" \
            --arg rq  "$(base64 -w0 actor/requirements.txt)" \
            --arg mp  "$(base64 -w0 actor/src/main.py)" \
            '{
              versionNumber: "0.2",
              sourceType: "SOURCE_FILES",
              buildTag: "latest",
              sourceFiles: [
                {name: ".actor/actor.json",        format: "BASE64", content: $aj},
                {name: ".actor/input_schema.json", format: "BASE64", content: $sch},
                {name: "Dockerfile",               format: "BASE64", content: $df},
                {name: "requirements.txt",         format: "BASE64", content: $rq},
                {name: "src/main.py",              format: "BASE64", content: $mp}
              ]
            }' > /tmp/actor_source.json
          echo "JSON generado: $(wc -c < /tmp/actor_source.json) bytes"

          # Intentar actualizar versión 0.2; si no existe, crearla
          HTTP_CODE=$(curl -s -o /tmp/resp_ver.json -w "%{http_code}" -X PUT \
            "https://api.apify.com/v2/acts/c5Dx4kjZENfbeKYi1/versions/0.2" \
            -H "Authorization: Bearer ${{ secrets.APIFY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d @/tmp/actor_source.json)
          echo "PUT /versions/0.2 → HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" = "404" ]; then
            echo "Version 0.2 no existe, creando con POST..."
            HTTP_CODE=$(curl -s -o /tmp/resp_ver.json -w "%{http_code}" -X POST \
              "https://api.apify.com/v2/acts/c5Dx4kjZENfbeKYi1/versions" \
              -H "Authorization: Bearer ${{ secrets.APIFY_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d @/tmp/actor_source.json)
            echo "POST /versions → HTTP $HTTP_CODE"
          fi
          cat /tmp/resp_ver.json | jq -r '.data.versionNumber // .error // .' 2>/dev/null || cat /tmp/resp_ver.json
          if [[ "$HTTP_CODE" != 2* ]]; then exit 1; fi

          # Disparar build
          HTTP_BUILD=$(curl -s -o /tmp/resp_build.json -w "%{http_code}" -X POST \
            "https://api.apify.com/v2/acts/c5Dx4kjZENfbeKYi1/builds?version=0.2&useCache=false" \
            -H "Authorization: Bearer ${{ secrets.APIFY_TOKEN }}")
          echo "POST /builds → HTTP $HTTP_BUILD"
          cat /tmp/resp_build.json | jq -r '.data.id // .error // .' 2>/dev/null || cat /tmp/resp_build.json
          if [[ "$HTTP_BUILD" != 2* ]]; then exit 1; fi
          BUILD_ID=$(cat /tmp/resp_build.json | jq -r '.data.id')
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT
          echo "Build iniciado: $BUILD_ID"

      - name: Esperar que termine el build (max 10 min)
        id: result
        run: |
          BUILD_ID="${{ steps.build.outputs.build_id }}"
          for i in $(seq 1 20); do
            sleep 30
            DATA=$(curl -sf \
              "https://api.apify.com/v2/acts/c5Dx4kjZENfbeKYi1/builds/$BUILD_ID" \
              -H "Authorization: Bearer ${{ secrets.APIFY_TOKEN }}")
            STATUS=$(echo "$DATA" | jq -r '.data.status')
            BUILD_NUM=$(echo "$DATA" | jq -r '.data.buildNumber')
            echo "[$i/20] Build status: $STATUS"
            if [ "$STATUS" = "SUCCEEDED" ] || [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "TIMED-OUT" ]; then
              echo "status=$STATUS" >> $GITHUB_OUTPUT
              echo "build_number=$BUILD_NUM" >> $GITHUB_OUTPUT
              echo "Build $STATUS — número: $BUILD_NUM"
              break
            fi
          done

      - name: Verificar build exitoso
        run: |
          if [ "${{ steps.result.outputs.status }}" != "SUCCEEDED" ]; then
            echo "Build FALLÓ: ${{ steps.result.outputs.status }}"
            exit 1
          fi
          echo "Build OK: ${{ steps.result.outputs.build_number }}"

      - name: Re-setup Task con nuevo build
        run: |
          TOKEN=$(curl -sf \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/services/srv-daraa5ad0e5s73dvng6g/env-vars" \
            | jq -r '.[] | select(.envVar.key == "INGEST_TOKEN") | .envVar.value // empty')
          if [ -z "$TOKEN" ]; then
            echo "No se encontro INGEST_TOKEN en Render"
            exit 1
          fi
          echo "::add-mask::$TOKEN"

          jq -n \
            --arg build "${{ steps.result.outputs.build_number }}" \
            --arg token "$TOKEN" \
            '{
              actId: "c5Dx4kjZENfbeKYi1",
              options: {build: $build, timeoutSecs: 3600, memoryMbytes: 1024},
              input: {
                portals: ["fincaraiz","metrocuadrado","ciencuadras","propdirecto"],
                max_per_portal: 300,
                ingest_url: "https://petra-inmuebles.onrender.com/scraper/ingest",
                ingest_token: $token
              }
            }' > /tmp/task_update.json

          HTTP_CODE=$(curl -s -o /tmp/resp_task.json -w "%{http_code}" -X PUT \
            "https://api.apify.com/v2/actor-tasks/MjJ6kqVOBFbrM9Z7s" \
            -H "Authorization: Bearer ${{ secrets.APIFY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d @/tmp/task_update.json)
          echo "PUT task → HTTP $HTTP_CODE"
          cat /tmp/resp_task.json | jq -r '.data.id // .error // .' 2>/dev/null || cat /tmp/resp_task.json
          if [[ "$HTTP_CODE" != 2* ]]; then
            echo "ADVERTENCIA: No se pudo actualizar la task (HTTP $HTTP_CODE) — build ${{ steps.result.outputs.build_number }} sigue disponible como 'latest'"
          else
            echo "Task MjJ6kqVOBFbrM9Z7s actualizada con build ${{ steps.result.outputs.build_number }}"
          fi

name: Build Actor Apify + Re-setup Task
on:
  push:
    branches:
      - trigger/build-actor

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Subir source al actor y disparar build
        id: build
        run: |
          # Construir JSON con jq (evita límites de tamaño de args del shell)
          jq -n \
            --arg aj "$(base64 -w0 actor/.actor/actor.json)" \
            --arg is "$(base64 -w0 actor/.actor/input_schema.json)" \
            --arg df "$(base64 -w0 actor/Dockerfile)" \
            --arg rq "$(base64 -w0 actor/requirements.txt)" \
            --arg mp "$(base64 -w0 actor/src/main.py)" \
            '{
              versionNumber: "0.2",
              sourceType: "SOURCE_FILES",
              buildTag: "latest",
              sourceFiles: [
                {name: ".actor/actor.json",        format: "BASE64", content: $aj},
                {name: ".actor/input_schema.json", format: "BASE64", content: $is},
                {name: "Dockerfile",               format: "BASE64", content: $df},
                {name: "requirements.txt",         format: "BASE64", content: $rq},
                {name: "src/main.py",              format: "BASE64", content: $mp}
              ]
            }' > /tmp/actor_source.json

          # Actualizar versión 0.2 con los archivos fuente
          RESP=$(curl -sf -X PUT \
            "https://api.apify.com/v2/acts/c5Dx4kjZENfbeKYi1/versions/0.2" \
            -H "Authorization: Bearer ${{ secrets.APIFY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d @/tmp/actor_source.json)
          echo "Version actualizada: $(echo $RESP | jq -r '.data.versionNumber // .error')"

          # Disparar build
          BUILD=$(curl -sf -X POST \
            "https://api.apify.com/v2/acts/c5Dx4kjZENfbeKYi1/builds?version=0.2&useCache=false" \
            -H "Authorization: Bearer ${{ secrets.APIFY_TOKEN }}")
          BUILD_ID=$(echo "$BUILD" | jq -r '.data.id')
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT
          echo "Build iniciado: $BUILD_ID"

      - name: Esperar que termine el build (max 10 min)
        id: result
        run: |
          BUILD_ID="${{ steps.build.outputs.build_id }}"
          for i in $(seq 1 20); do
            sleep 30
            DATA=$(curl -sf \
              "https://api.apify.com/v2/acts/c5Dx4kjZENfbeKYi1/builds/$BUILD_ID" \
              -H "Authorization: Bearer ${{ secrets.APIFY_TOKEN }}")
            STATUS=$(echo "$DATA" | jq -r '.data.status')
            BUILD_NUM=$(echo "$DATA" | jq -r '.data.buildNumber')
            echo "[$i/20] Build status: $STATUS"
            if [ "$STATUS" = "SUCCEEDED" ] || [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "TIMED-OUT" ]; then
              echo "status=$STATUS" >> $GITHUB_OUTPUT
              echo "build_number=$BUILD_NUM" >> $GITHUB_OUTPUT
              echo "Build $STATUS — número: $BUILD_NUM"
              break
            fi
          done

      - name: Verificar build exitoso
        run: |
          if [ "${{ steps.result.outputs.status }}" != "SUCCEEDED" ]; then
            echo "Build FALLÓ: ${{ steps.result.outputs.status }}"
            exit 1
          fi
          echo "Build OK: ${{ steps.result.outputs.build_number }}"

      - name: Re-setup Task con nuevo build
        run: |
          TOKEN=$(curl -sf \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/services/srv-daraa5ad0e5s73dvng6g/env-vars" \
            | jq -r '.[] | select(.envVar.key == "INGEST_TOKEN") | .envVar.value // empty')
          if [ -z "$TOKEN" ]; then
            echo "No se encontro INGEST_TOKEN en Render"
            exit 1
          fi
          echo "::add-mask::$TOKEN"

          curl -sf -X PUT \
            "https://api.apify.com/v2/actor-tasks/MjJ6kqVOBFbrM9Z7s" \
            -H "Authorization: Bearer ${{ secrets.APIFY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"actId\": \"c5Dx4kjZENfbeKYi1\",
              \"options\": {
                \"build\": \"${{ steps.result.outputs.build_number }}\",
                \"timeoutSecs\": 3600,
                \"memoryMbytes\": 1024
              },
              \"input\": {
                \"portals\": [\"fincaraiz\", \"metrocuadrado\", \"ciencuadras\", \"propdirecto\"],
                \"max_per_portal\": 300,
                \"ingest_url\": \"https://petra-inmuebles.onrender.com\",
                \"ingest_token\": \"$TOKEN\"
              }
            }" > /dev/null

          echo "Task MjJ6kqVOBFbrM9Z7s actualizada con build ${{ steps.result.outputs.build_number }}"

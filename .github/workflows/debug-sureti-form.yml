name: Debug Sureti — mapear formulario
on:
  workflow_dispatch:

jobs:
  mapear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Playwright
        run: |
          pip install playwright
          python -m playwright install chromium --with-deps

      - name: Login y mapear /nuevo-lead
        run: |
          python3 - <<'EOF'
          import json, time
          from playwright.sync_api import sync_playwright

          EMAIL    = "${{ secrets.SURETI_EMAIL }}"
          PASSWORD = "${{ secrets.SURETI_PASSWORD }}"
          URL      = "https://agentes.sureti.co"

          def dump_page(page, label):
              print(f"\n{'='*60}")
              print(f"  {label}")
              print(f"  URL: {page.url}")
              print(f"{'='*60}")
              result = page.evaluate("""() => {
                  const all = [...document.querySelectorAll('input, select, textarea')];
                  return all.map(el => ({
                      tag: el.tagName, type: el.type || null,
                      name: el.name || null, id: el.id || null,
                      placeholder: el.placeholder || null,
                      className: el.className.slice(0, 60) || null,
                  }));
              }""")
              print(f"Form elements ({len(result)}):")
              for el in result:
                  print(" ", json.dumps(el, ensure_ascii=False))
              labels = page.evaluate("""() =>
                  [...document.querySelectorAll('label')].map(l => ({
                      text: l.innerText.trim().slice(0, 80),
                      for: l.getAttribute('for'),
                  }))""")
              print(f"Labels ({len(labels)}):")
              for l in labels:
                  print(" ", json.dumps(l, ensure_ascii=False))
              body = page.evaluate("() => document.body.innerHTML.slice(0, 5000)")
              print(f"\n--- body HTML (5000 chars) ---\n{body}\n---")

          with sync_playwright() as pw:
              browser = pw.chromium.launch(headless=True, args=["--no-sandbox"])
              page = browser.new_page()
              page.set_extra_http_headers({"Accept-Language": "es-CO,es;q=0.9"})

              # 1. Login en /auth
              print("→ Navegando a /auth...")
              page.goto(f"{URL}/auth", wait_until="domcontentloaded", timeout=30_000)
              page.wait_for_selector("input[name='email']", timeout=15_000)
              page.screenshot(path="ss_login.png", full_page=True)
              dump_page(page, "PÁGINA LOGIN /auth")

              page.fill("input[name='email']", EMAIL)
              page.fill("input[type='password']", PASSWORD)
              page.screenshot(path="ss_login_filled.png", full_page=True)
              page.click("button[type='submit']")
              page.wait_for_load_state("networkidle", timeout=20_000)
              time.sleep(2)
              page.screenshot(path="ss_post_login.png", full_page=True)
              print(f"→ URL post-login: {page.url}")
              dump_page(page, "POST-LOGIN")

              if "/auth" in page.url:
                  print("[ERROR] Login falló — sigue en /auth")
              else:
                  print("✅ Login exitoso")

              # 2. Navegar a /nuevo-lead
              print("\n→ Navegando a /nuevo-lead...")
              page.goto(f"{URL}/nuevo-lead", wait_until="domcontentloaded", timeout=20_000)
              time.sleep(3)
              page.screenshot(path="ss_form.png", full_page=True)
              print(f"→ URL: {page.url}")
              dump_page(page, "FORMULARIO /nuevo-lead")

              with open("form.html", "w") as f:
                  f.write(page.content())
              print("\nform.html guardado")

              browser.close()
          EOF

      - name: Subir artefactos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sureti-form-debug
          path: |
            ss_login.png
            ss_login_filled.png
            ss_post_login.png
            ss_form.png
            form.html
          retention-days: 3

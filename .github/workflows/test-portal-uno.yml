name: Test Portal Individual
on:
  push:
    branches:
      - trigger/test-portal-*

jobs:
  test-portal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Extraer nombre del portal del branch
        id: portal
        run: |
          BRANCH="${GITHUB_REF#refs/heads/trigger/test-portal-}"
          echo "name=$BRANCH" >> $GITHUB_OUTPUT
          echo "Probando portal: $BRANCH"

      - name: Leer INGEST_TOKEN de Render
        id: token
        run: |
          TOKEN=$(curl -sf \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/services/srv-daraa5ad0e5s73dvng6g/env-vars" \
            | jq -r '.[] | select(.envVar.key == "INGEST_TOKEN") | .envVar.value // empty')
          if [ -z "$TOKEN" ]; then
            echo "No se encontro INGEST_TOKEN en Render"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "value=$TOKEN" >> $GITHUB_OUTPUT

      - name: Disparar actor Apify (1 portal)
        id: run
        run: |
          RUN=$(curl -sf -X POST \
            "https://api.apify.com/v2/actors/c5Dx4kjZENfbeKYi1/runs?build=latest&timeout=600&memory=1024" \
            -H "Authorization: Bearer ${{ secrets.APIFY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg portal "${{ steps.portal.outputs.name }}" \
              --arg ingest_token "${{ steps.token.outputs.value }}" \
              --arg captcha "${{ secrets.TWOCAPTCHA_API_KEY }}" \
              '{portals:[$portal],max_per_portal:5,ingest_url:"https://petra-inmuebles.onrender.com/scraper/ingest",ingest_token:$ingest_token,twocaptcha_api_key:$captcha}')")
          RUN_ID=$(echo "$RUN" | jq -r '.data.id')
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "Actor run iniciado: $RUN_ID"

      - name: Esperar resultado (max 8 min)
        id: result
        run: |
          RUN_ID="${{ steps.run.outputs.run_id }}"
          for i in $(seq 1 20); do
            sleep 30
            STATUS=$(curl -sf \
              "https://api.apify.com/v2/actor-runs/$RUN_ID" \
              -H "Authorization: Bearer ${{ secrets.APIFY_TOKEN }}" \
              | jq -r '.data.status')
            echo "[$i/16] Status: $STATUS"
            if [ "$STATUS" = "SUCCEEDED" ] || [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "TIMED-OUT" ]; then
              echo "status=$STATUS" >> $GITHUB_OUTPUT
              break
            fi
          done
          # Si el loop agotó sin capturar estado terminal, guardar el último STATUS conocido
          grep -q "^status=" "$GITHUB_OUTPUT" 2>/dev/null || echo "status=${STATUS:-UNKNOWN}" >> $GITHUB_OUTPUT

      - name: Ver resultados del portal
        run: |
          RUN_ID="${{ steps.run.outputs.run_id }}"
          DATASET_ID=$(curl -sf \
            "https://api.apify.com/v2/actor-runs/$RUN_ID" \
            -H "Authorization: Bearer ${{ secrets.APIFY_TOKEN }}" \
            | jq -r '.data.defaultDatasetId')

          ITEM_COUNT=$(curl -sf \
            "https://api.apify.com/v2/datasets/$DATASET_ID" \
            -H "Authorization: Bearer ${{ secrets.APIFY_TOKEN }}" \
            | jq -r '.data.itemCount')

          echo "=== PORTAL: ${{ steps.portal.outputs.name }} ==="
          echo "Contactos encontrados: $ITEM_COUNT"

          curl -sf \
            "https://api.apify.com/v2/datasets/$DATASET_ID/items?clean=true&format=json" \
            -H "Authorization: Bearer ${{ secrets.APIFY_TOKEN }}" \
            | jq -r '.[] | "  tel=\(.telefono) ciudad=\(.ciudad) tipo=\(.tipo) precio=\(.precio)"'

          echo "Status final: ${{ steps.result.outputs.status }}"
          if [ "${{ steps.result.outputs.status }}" != "SUCCEEDED" ]; then
            echo "FALLO: actor no terminó exitosamente"
            exit 1
          fi
          if [ "$ITEM_COUNT" = "0" ]; then
            echo "ADVERTENCIA: 0 contactos encontrados"
          fi

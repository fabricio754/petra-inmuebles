name: Admin recovery pilot (recuperar IN perdidos del 6-oct)

on:
  workflow_dispatch:

jobs:
  recovery:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar POST /admin/recovery-pilot
        env:
          TOKEN: ${{ secrets.ADMIN_RESET_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "Falta GitHub Secret ADMIN_RESET_TOKEN (ponerle el mismo valor que el env var ADMIN_RESET_TOKEN de Render)."
            exit 1
          fi
          RESP=$(curl -sf -X POST https://petra-inmuebles.onrender.com/admin/recovery-pilot \
            -H "X-Admin-Token: $TOKEN") \
          && echo "Respuesta: $RESP" \
          || { echo "ERROR llamando al endpoint"; exit 1; }

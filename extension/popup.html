<!doctype html>
<html lang="es">
<head><meta charset="utf-8">
<style>
  body { font: 14px/1.4 system-ui, sans-serif; width: 280px; padding: 12px; color: #1f2328; }
  h1 { font-size: 16px; margin: 0 0 8px; }
  label { display: block; margin: 10px 0 4px; }
  input[type=password] { width: 100%; box-sizing: border-box; padding: 6px; }
  button { margin-top: 10px; padding: 6px 12px; }
  small { color: #57606a; }
</style></head>
<body>
  <h1>Enviar a Massi</h1>
  <label><input type="checkbox" id="activo"> Activa (captura el botón de WhatsApp/Llamar)</label>
  <label for="clave">Clave de captura</label>
  <input type="password" id="clave" placeholder="La misma de CAPTURA_TOKEN en Render">
  <button id="guardar">Guardar</button> <small id="estado"></small>
  <p><small>Con la extensión activa, al tocar WhatsApp o Llamar en un anuncio no se abre tu WhatsApp: el contacto se envía a Massi.</small></p>
  <script src="popup.js"></script>
</body>
</html>
